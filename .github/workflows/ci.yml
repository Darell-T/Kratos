name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is where Kratos runs today and where the sandbox tests prove real blocking (D99).
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  real-codex:
    name: Real Codex sandbox (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pinned native Codex without package scripts
        shell: pwsh
        run: |
          $install = Join-Path $env:USERPROFILE 'kratos-real-codex-cli'
          npm install --prefix $install --ignore-scripts --no-audit --no-fund '@openai/codex@0.159.1'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Codex installation failed' }
          $exe = Join-Path $install 'node_modules/@openai/codex-win32-x64/vendor/x86_64-pc-windows-msvc/bin/codex.exe'
          "KRATOS_REAL_CODEX_EXE=$exe" >> $env:GITHUB_ENV
          "KRATOS_REAL_CODEX_HOME=$(Join-Path $env:USERPROFILE 'kratos-real-codex-home')" >> $env:GITHUB_ENV
      - name: Provision the isolated elevated sandbox
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:KRATOS_REAL_CODEX_HOME -Force | Out-Null
          & $env:KRATOS_REAL_CODEX_EXE sandbox setup --elevated --current-user --codex-home $env:KRATOS_REAL_CODEX_HOME
          if ($LASTEXITCODE -ne 0) { throw 'Windows sandbox provisioning failed' }
      - name: Prove real sandbox denial and engine API isolation without a paid model
        run: cargo test -p kratos-engine --test real_codex --locked -- --ignored --test-threads=1 --nocapture

  complexity:
    name: Complexity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fails on any function with cyclomatic complexity 12 or more, the point at which a function
      # gets rethought rather than split into a tiny helper. kratos-command-safety is Codex's code,
      # copied unchanged so it can be compared with upstream, so its functions keep Codex's shape.
      - run: pipx run --spec lizard==1.24.2 lizard -l rust -C 11 -w -x "crates/kratos-command-safety/*" crates tools

  node:
    name: Node tools
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
