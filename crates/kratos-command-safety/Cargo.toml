[package]
name = "kratos-command-safety"
description = "Codex's dangerous-command check, copied from openai/codex so Kratos can run it on every command an agent asks to run"
version = "0.1.0"
edition.workspace = true
# The files copied from Codex keep Codex's license, Apache-2.0; LICENSE-APACHE and NOTICE-CODEX
# hold its text and notice. Kratos's own code in this crate is MIT, like the rest of the workspace.
license = "MIT AND Apache-2.0"
publish.workspace = true
rust-version.workspace = true

# The versions Codex 0.159.1 locks, so the copied parsers behave as they do inside Codex.
[dependencies]
once_cell = "1.21.4"
regex = "1.12.3"
shlex = "1.3.0"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25.1"
tree-sitter-powershell = "=0.26.4"
url = "2.5.8"

[dev-dependencies]
pretty_assertions = "1.4.1"
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
